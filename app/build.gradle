plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oceantech.nourcontroller'
    compileSdk 36

    defaultConfig {
        applicationId 'com.oceantech.nourcontroller'
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName '0.9.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}
