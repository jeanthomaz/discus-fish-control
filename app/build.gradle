plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jeanthomaz.discusfishcontrol'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.jeanthomaz.discusfishcontrol'
        minSdk 23
        targetSdk 36
        versionCode 11
        versionName '0.9.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}
